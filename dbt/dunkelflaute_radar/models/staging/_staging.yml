version: 2

models:
  - name: stg_openmeteo__weather
    columns:
      - name: zone
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DE']
      - name: valid_time
        tests:
          - not_null
      - name: ingest_ts
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zone
              - valid_time
              - ingest_ts

  - name: stg_entsoe__generation
    columns:
      - name: zone
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DE']
      - name: valid_time
        tests:
          - not_null
      - name: ingest_ts
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zone
              - valid_time
              - ingest_ts
